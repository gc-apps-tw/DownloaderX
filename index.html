<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DownloaderX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 修正黃線：標題純白、強制一行、自動縮放 */
        .hero-title {
            font-size: clamp(1.2rem, 7.5vw, 2.5rem);
            font-weight: 900;
            white-space: nowrap; 
            text-align: center;
            margin: 50px 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* 玻璃質感容器 */
        .container-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
        }

        /* 修正物件大小與對齊 */
        .search-bar {
            display: flex;
            height: 56px;
            background: #111;
            border: 1px solid #333;
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
        }

        .btn-send {
            width: 56px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        /* 修正紅線：預覽圖區塊固定 16:9 */
        .preview-card {
            margin-top: 24px;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0a0a0a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            position: relative;
        }

        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* 下載按鈕 */
        .btn-download {
            width: 100%;
            background: #fff;
            color: #000;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .hidden { display: none; }
    </style>
</head>
<body>

    <h1 class="hero-title">解析一切媒體資源</h1>

    <div class="container-box">
        <div class="search-bar">
            <input type="text" id="urlInput" placeholder="貼上 YouTube 連結..." spellcheck="false">
            <button onclick="analyze()" class="btn-send">
                <i id="btnIcon" class="fas fa-paper-plane"></i>
            </button>
        </div>

        <div id="resultArea" class="hidden">
            <div class="preview-card">
                <img id="thumb" src="" alt="Thumbnail" onload="this.style.display='block'">
            </div>
            
            <div class="mt-4">
                <p id="videoTitle" class="text-sm font-bold text-white/80 line-clamp-2"></p>
                <div class="flex gap-2 mt-2">
                    <span class="text-[10px] bg-white/10 px-2 py-1 rounded text-white/40 font-mono" id="platform">YOUTUBE</span>
                </div>
            </div>

            <button id="dlLink" class="btn-download">
                <i class="fas fa-download"></i>
                下載影片
            </button>
        </div>
    </div>

    <script>
        // 對應你的 Hugging Face API 網址
        const API_BASE = "https://oliver2013tw-dwnx-back.hf.space/api/analyze";

        async function analyze() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            const icon = document.getElementById('btnIcon');
            const resArea = document.getElementById('resultArea');
            const thumb = document.getElementById('thumb');

            // UI 狀態切換
            icon.className = "fas fa-circle-notch loading-spin";
            resArea.classList.add('hidden');
            thumb.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('thumb').src = data.thumbnail;
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('platform').innerText = data.platform || "MEDIA";
                    
                    // 下載功能
                    document.getElementById('dlLink').onclick = () => {
                        window.open(data.download_url, '_blank');
                    };

                    resArea.classList.remove('hidden');
                } else {
                    alert("解析失敗: " + data.error);
                }
            } catch (err) {
                alert("無法連接到後端 API，請確認 Space 是否正在運行。");
            } finally {
                icon.className = "fas fa-paper-plane";
            }
        }

        // 支援 Enter 鍵
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
